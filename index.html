<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katherine + Tim's Wedding</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: <link rel="stylesheet" href="https://cdn.cursors-4u.net/cursors/animated/rising-light-red-heart-93d87009-32.css">
        }
        body {
            font-family: 'Cormorant Garamond', serif;
            color: #333;
        }

        /* FULL SCREEN HERO WITH CANVA IMAGE */
        .hero {
            background-image: url('page1-landing.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 60px 20px;
            position: relative;
        }

        /* Semi-transparent overlay for better button visibility */
        .hero::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to top, rgba(245, 230, 211, 0.95), transparent);
            pointer-events: none;
        }

        .hero-content {
            z-index: 10;
            text-align: center;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3em;
            color: #333;
            margin-bottom: 40px;
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* BUTTONS */
        .nav-buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .nav-btn {
            border: 2.5px solid #a41e3a;
            background: white;
            color: #a41e3a;
            padding: 14px 40px;
            font-size: 1.1em;
            cursor: pointer;
            border-radius: 50px;
            font-family: 'Cormorant Garamond', serif;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(164, 30, 58, 0.1);
        }

        .nav-btn:hover {
            background: #a41e3a;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(164, 30, 58, 0.2);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            font-size: 1.5em;
            z-index: 5;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-15px); }
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero {
                min-height: 100vh;
                justify-content: center;
            }

            .hero::before {
                height: 300px;
            }

            .hero-text {
                font-size: 1.1em;
            }

            .nav-buttons {
                gap: 20px;
                flex-direction: column;
            }

            .nav-btn {
                width: 100%;
                max-width: 250px;
                padding: 12px 30px;
            }

            .scroll-indicator {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .hero-text {
                font-size: 1em;
                margin-bottom: 30px;
            }

            .nav-btn {
                font-size: 1em;
                padding: 12px 25px;
            }
        }
    </style>
</head>
<body>

    <!-- FULL SCREEN HERO LANDING PAGE -->
    <div class="hero">
        <div class="hero-content">
            <p class="hero-text">Join us to celebrate our special day</p>
            
            <div class="nav-buttons">
                <a href="details.html" class="nav-btn">Details</a>
                <a href="details.html#rsvp" class="nav-btn">RSVP</a>
            </div>
        </div>

        <div class="scroll-indicator">⬇️</div>
    </div>

</body>
</html>
