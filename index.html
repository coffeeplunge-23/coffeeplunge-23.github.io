
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katherine + Tim's Wedding</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('sym229.ani'), auto;
        }
    </style>
 
    <style>
        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #f5e6d3;
            color: #333;
        }
 
        .hero-image {
            width: 100%;
            max-width: 100%;
            display: block;
        }
 
        .hero {
            background-color: #f5e6d3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            position: relative;
        }
 
        .hero-content {
            text-align: center;
            animation: fadeInUp 1s ease-out;
        }
 
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
 
        .hero-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3em;
            color: #333;
            margin-bottom: 40px;
            font-weight: 400;
            letter-spacing: 1px;
        }
 
        .nav-buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
 
        .nav-btn {
            border: 2.5px solid #a41e3a;
            background: white;
            color: #a41e3a;
            padding: 14px 40px;
            font-size: 1.1em;
            cursor: pointer;
            border-radius: 50px;
            font-family: 'Cormorant Garamond', serif;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(164, 30, 58, 0.1);
        }
 
        .nav-btn:hover {
            background: #a41e3a;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(164, 30, 58, 0.2);
        }
 
        .scroll-indicator {
            margin-top: 20px;
            font-size: 1.5em;
            animation: bounce 2s infinite;
        }
 
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
 
        @media (max-width: 768px) {
            .hero-text {
                font-size: 1.1em;
            }
 
            .nav-buttons {
                gap: 20px;
                flex-direction: column;
            }
 
            .nav-btn {
                width: 100%;
                max-width: 250px;
                padding: 12px 30px;
            }
 
            .scroll-indicator {
                display: none;
            }
        }
 
        @media (max-width: 480px) {
            .hero-text {
                font-size: 1em;
                margin-bottom: 30px;
            }
 
            .nav-btn {
                font-size: 1em;
                padding: 12px 25px;
            }
        }
    </style>
</head>
<body>
 
    <!-- HERO IMAGE -->
    <img src="page1-landing.png" alt="Katherine + Tim Wedding" class="hero-image">
 
    <!-- BUTTONS BELOW IMAGE -->
    <div class="hero">
        <div class="hero-content">
            <p class="hero-text">Join us to celebrate our special day</p>
            
            <div class="nav-buttons">
                <a href="details.html" class="nav-btn">Details</a>
                <a href="details.html#rsvp" class="nav-btn">RSVP</a>
            </div>
        </div>
 
        <div class="scroll-indicator">⬇️</div>
    </div>
 
</body>
</html>
